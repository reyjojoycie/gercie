<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100%"
  height="100%"
  fill="none"
>
  <defs>
    <pattern
      id="grid-pattern"
      x="0"
      y="0"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse"
    >
      <!-- Intersections principales (points) -->
      <circle cx="20" cy="20" r="0.5" fill="currentColor" opacity="0.15" />
      <!-- Lignes horizontales subtiles -->
      <path
        d="M 0 20 H 40"
        stroke="currentColor"
        stroke-width="0.5"
        opacity="0.05"
      />
      <!-- Lignes verticales subtiles -->
      <path
        d="M 20 0 V 40"
        stroke="currentColor"
        stroke-width="0.5"
        opacity="0.05"
      />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid-pattern)" />
</svg>